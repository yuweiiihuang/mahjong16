name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Python tests
        run: uv run --locked pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web tests
        run: node --test tests/web/*.mjs
