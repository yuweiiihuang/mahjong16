[project]
name = "mahjong16"
version = "0.1.0"
description = "first version"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.30.1",
    "pandas>=2.3.3",
    "pytest>=8",
    "rich>=14.1.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.6,<3",
]
rl-cu126 = [
    "torch==2.14.1+cu126; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [[{ extra = "rl" }, { extra = "rl-cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "rl-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
