[project]
name = "mahjong16"
version = "0.1.0"
description = "first version"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.30.1",
    "pandas>=2.3.3",
    "pytest>=8",
    "rich>=14.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installable so ../mahjong16-research can depend on it; editable installs add the repo root.
[tool.hatch.build.targets.wheel]
packages = ["app", "bots", "domain", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
