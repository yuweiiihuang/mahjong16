<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進入牌桌 · 青禾麻將</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #f7f7ef; color: #193f34;
    font-family: system-ui, sans-serif; }
  main { width: min(100%, 360px); }
  h1 { font-size: 28px; margin: 0 0 32px; }
  label { display: block; margin-bottom: 10px; }
  input, button { width: 100%; padding: 14px; border-radius: 10px; font: inherit; }
  input { border: 1px solid #b9c9b5; background: #fff; }
  input:focus-visible, button:focus-visible { outline: 3px solid #90b69b; outline-offset: 3px; }
  button { border: 0; background: #285b47; color: white; cursor: pointer; }
  p { min-height: 24px; color: #a44336; font-size: 14px; }
</style>
<main>
  <h1>青禾麻將</h1>
  <form method="post" action="/access/login">
    <label for="password">通行碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p role="alert"><!--error--></p>
    <button type="submit">進入牌桌</button>
  </form>
</main>
</html>
