<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青禾 · 萬字牌字體選擇</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0e5;color:#122e29;font-family:system-ui,sans-serif}main{max-width:1440px;padding:30px;margin:auto}h1{font-size:28px}p{color:#647767;line-height:1.7}select{font:inherit;padding:10px;border:1px solid #c8d0bf;background:#f8f8f0;color:#122e29;border-radius:8px}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.hand{display:flex;gap:10px;flex-wrap:wrap;background:#285747;border-radius:12px;padding:24px;margin:20px 0}.tile{display:block;width:calc(49px * var(--zoom));height:calc(68px * var(--zoom));border:1px solid #d8d8c8;background:#f7f6ef;border-radius:6px;box-shadow:0 4px #196241}.tile img{width:100%;height:100%;padding:9.665% 10.417%;object-fit:fill}.board{width:100%}a{color:#285747}</style><main><h1>青禾 · 萬字牌字體選擇</h1><p>A 保留為預設。新增手寫楷書、毛筆書法與鋼筆手寫，字形皆已轉為 SVG 路徑，數字與「萬」同字級。</p><div class="controls"><label>字體 <select id="font"><option value="serif">A · 典雅宋體</option><option value="wenkai">霞鶩文楷</option><option value="brush">Yuji Syuku</option><option value="iansui">芫荽 Iansui</option><option value="klee">Klee One</option></select></label><label>預覽倍率 <input id="zoom" type="range" min="0.65" max="2" step="0.05" value="1"></label><a href="comparison.svg">SVG 比較圖</a><a href="/">回牌桌</a></div><div class="hand" id="hand"></div><p>在牌桌右上角「設定 → 萬字牌字體」也能預覽、儲存並套用到 3D 牌桌。Yuji Syuku 為日式毛筆字形，使用繁體「萬」。</p><img class="board" src="comparison.svg" alt="宋體、文楷與毛筆書法比較"><script>function render(){const font=document.querySelector('#font').value,hand=document.querySelector('#hand');hand.style.setProperty('--zoom',document.querySelector('#zoom').value);hand.innerHTML=Array.from({length:9},(_,id)=>`<span class="tile"><img src="../../assets/tiles/fonts/${font}/${id}.svg" alt="${id+1}萬"></span>`).join('')}document.querySelector('#font').onchange=render;document.querySelector('#zoom').oninput=render;render()</script></main></html>
