<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青和 · 萬字牌樣式提案</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0e5;color:#122e29;font-family:system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:30px}h1{font-size:28px;margin:0 0 12px}p{color:#647767;line-height:1.7}a{color:#285747}.board{width:100%;display:block;margin-top:24px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:22px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}button{color:inherit;text-align:left;background:#f8f8f0;border:1px solid #ccd3c4;border-radius:12px;padding:18px;cursor:pointer}button[aria-pressed=true]{outline:2px solid #285747}strong,span{display:block}span{font-size:12px;color:#647767;margin-top:8px}.samples{display:flex;gap:12px;background:#285747;padding:18px 12px;margin-top:16px;border-radius:8px;justify-content:center}.tile{display:inline-flex;flex:none;width:var(--tw,49px);height:var(--th,68px);border-radius:var(--tr,6px);background:#f7f6ef;border:1px solid #d8d8c8;box-shadow:0 4px #196241}.tile img{width:100%;height:100%;padding:9.665% 10.417%;object-fit:fill}.hand{display:flex;gap:6px;flex-wrap:wrap;padding:25px;background:#285747;border-radius:12px;min-height:145px;align-items:center}.hand .tile{width:calc(var(--tw)*var(--zoom));height:calc(var(--th)*var(--zoom));border-radius:calc(var(--tr)*var(--zoom))}label{font-size:14px}#selection{font-weight:600}.note{font-size:13px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:16px}}@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style><main><h1>青和 · 萬字牌樣式提案</h1><p>保留米白牌身、玉綠牌背、深綠數字與朱紅「萬」。四組皆為 SVG 路徑字形，數字與「萬」使用相同字級與字框。點選方案，可比較一至九萬的手牌尺寸。</p><div class="cards"><button data-option="a" style="--tw:49px;--th:68px;--tr:6px"><strong>A · 典雅宋體</strong><span>推薦 · 最接近青和的典雅氣質</span><div class="samples"><i class="tile"><img src="a/1.svg" alt="1萬"></i><i class="tile"><img src="a/5.svg" alt="5萬"></i><i class="tile"><img src="a/9.svg" alt="9萬"></i></div></button><button data-option="b" style="--tw:53px;--th:68px;--tr:8px"><strong>B · 放大粗宋</strong><span>字面更飽滿 · 小尺寸容易辨認</span><div class="samples"><i class="tile"><img src="b/1.svg" alt="1萬"></i><i class="tile"><img src="b/5.svg" alt="5萬"></i><i class="tile"><img src="b/9.svg" alt="9萬"></i></div></button><button data-option="c" style="--tw:49px;--th:68px;--tr:11px"><strong>C · 圓潤黑體</strong><span>粗細均勻 · 筆畫俐落、辨識直接</span><div class="samples"><i class="tile"><img src="c/1.svg" alt="1萬"></i><i class="tile"><img src="c/5.svg" alt="5萬"></i><i class="tile"><img src="c/9.svg" alt="9萬"></i></div></button><button data-option="d" style="--tw:46px;--th:72px;--tr:4px"><strong>D · 修長細宋</strong><span>留白較多 · 安靜、偏文雅</span><div class="samples"><i class="tile"><img src="d/1.svg" alt="1萬"></i><i class="tile"><img src="d/5.svg" alt="5萬"></i><i class="tile"><img src="d/9.svg" alt="9萬"></i></div></button></div><div class="controls"><b id="selection"></b><label>預覽倍率 <input id="zoom" type="range" min="0.65" max="2" step="0.05" value="1"></label><label><input id="body" type="checkbox" checked> 套用提案牌身比例與圓角</label><a href="comparison.svg" download>下載 SVG 比較圖</a></div><div class="hand" id="hand"></div><p class="note">關閉牌身選項，可在現有 49×68 比例下比較純牌面。牌身形狀是示意，正式採用時需同步調整 Three.js 幾何；目前遊戲仍使用原版素材。字形：Noto Serif / Sans CJK TC（SIL OFL），已轉路徑，不依賴裝置字體。</p><img class="board" src="comparison.svg" alt="目前版本與四組 SVG 萬字牌樣式比較"><script>
const options={"a": {"title": "A · 典雅宋體", "w": 49, "h": 68, "r": 6}, "b": {"title": "B · 放大粗宋", "w": 53, "h": 68, "r": 8}, "c": {"title": "C · 圓潤黑體", "w": 49, "h": 68, "r": 11}, "d": {"title": "D · 修長細宋", "w": 46, "h": 72, "r": 4}};let key='a';function render(){const o=options[key],body=document.querySelector('#body').checked,hand=document.querySelector('#hand');hand.style.cssText=`--tw:${body?o.w:49}px;--th:${body?o.h:68}px;--tr:${body?o.r:6}px;--zoom:${document.querySelector('#zoom').value}`;hand.innerHTML=Array.from({length:9},(_,i)=>`<i class="tile"><img src="${key}/${i+1}.svg" alt="${i+1}萬"></i>`).join('');document.querySelector('#selection').textContent=o.title;document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===key)))}document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{key=b.dataset.option;render()});document.querySelector('#zoom').oninput=render;document.querySelector('#body').onchange=render;render();
</script></main></html>
